<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="A quiet, offline breathing space for rest, focus and bedtime.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Quiet Breath">
    <meta property="og:description" content="A quieter place to breathe.">
    <meta property="og:image" content="https://alexj456.github.io/Box5n21/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Quiet Breath">
    <meta name="twitter:description" content="A quieter place to breathe.">
    <meta name="twitter:image" content="https://alexj456.github.io/Box5n21/og.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quiet Breath">
    <title>Quiet Breath</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.PNG">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <noscript>
        <div class="noscript">Quiet Breath needs JavaScript to guide the breathing timer. Once loaded, it works offline.</div>
    </noscript>

    <main id="app" class="app-shell" tabindex="-1"></main>
    <div id="settings-layer"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-hidden="true"></div>
    <div id="phase-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <!-- Safari on iOS 18 can provide a best-effort system haptic for a native switch. -->
    <input id="ios-haptic-switch" class="haptic-proxy" type="checkbox" switch tabindex="-1" aria-hidden="true">

    <script type="module" src="app.js"></script>
</body>
</html>
